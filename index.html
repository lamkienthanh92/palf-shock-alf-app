<style>
:root{

}
@media (prefers-color-scheme: dark){

    --paper:#151D21; --surface:#1C262B; --field:#222E34;
    --ink:#E4EAE7; --ink-2:#B3C0BA; --ink-3:#8E9B96;
    --line:#35443F; --line-2:#2A3735;
    --alive:#5DB5B1; --dead:#E07A84; --bile:#D9AE4C; --slate:#9AA8B3;
    --warn-bg:#382F1E; --warn-ink:#EBCB86; --focus:#5DB5B1; --on-accent:#10181B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151D21; --surface:#1C262B; --field:#222E34;
  --ink:#E4EAE7; --ink-2:#B3C0BA; --ink-3:#8E9B96;
  --line:#35443F; --line-2:#2A3735;

  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{

  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

}
.wrap{max-width:1240px; margin:0 auto; padding:24px clamp(14px,3vw,32px) 48px}
header h1{font-size:clamp(1.45rem,2.6vw,2.05rem); line-height:1.2; font-weight:700; letter-spacing:-0.012em; margin:0 0 8px; max-width:30ch}
header p.sub{margin:0; color:var(--ink-2); max-width:72ch}
.notice{margin:16px 0 0; background:var(--warn-bg); color:var(--warn-ink); border-left:3px solid var(--bile); padding:9px 14px; border-radius:3px; max-width:78ch; font-size:.92rem}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:22px 0 18px; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.toolbar .spacer{flex:1}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--field)}
.seg button{border:0; background:transparent; color:var(--ink-2); font:inherit; font-weight:500; padding:7px 13px; cursor:pointer; min-width:48px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.tlabel{color:var(--ink-3); font-size:.85rem}
.btn{border:1px solid var(--line); background:var(--field); color:var(--ink); font:inherit; font-size:.9rem; padding:7px 12px; border-radius:7px; cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.quiet{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.tabs{display:none}
.grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:32px; align-items:start}
@media (max-width:960px){
  .grid{grid-template-columns:1fr; gap:20px}
  .tabs{display:flex; position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding:8px 0; margin-bottom:4px}
  .tabs .seg{width:100%} .tabs .seg button{flex:1; padding:9px}
  .grid[data-tab="input"] .results{display:none}

}
/* form */
.form fieldset{border:0; margin:0 0 22px; padding:0}
.form legend{font-weight:650; font-size:1rem; padding:0; margin-bottom:2px}
.form .hint{color:var(--ink-3); font-size:.84rem; margin:0 0 10px}
.fields{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px; margin-top:8px}
.field{display:grid; gap:3px; align-content:start}
.field.wide{grid-column:1/-1}
.field label,.field .lab{font-size:.83rem; color:var(--ink-2)}
.inp{display:flex; align-items:center; border:1px solid var(--line); background:var(--field); border-radius:6px}
.inp:focus-within{outline:2px solid var(--focus); outline-offset:1px}
.inp input{border:0; background:transparent; color:var(--ink); font:inherit; padding:8px 10px; width:100%; min-width:0}
.inp input:focus{outline:none}
.inp .unit{padding:0 10px 0 4px; color:var(--ink-3); font-size:.78rem; white-space:nowrap}
select{width:100%; border:1px solid var(--line); background:var(--field); color:var(--ink); font:inherit; padding:8px 10px; border-radius:6px}
.check{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--ink); padding-top:6px}
.check input{width:18px; height:18px; accent-color:var(--alive)}
.form .group-rule{border-top:1px solid var(--line-2); padding-top:16px}

.results h2{font-size:1.08rem; font-weight:650; margin:0 0 4px}
.results .lede{color:var(--ink-2); margin:0 0 14px; max-width:70ch; font-size:.92rem}
.map{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 18px 12px}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.84rem; color:var(--ink-2); margin:0 0 12px}
.legend i{display:inline-block; width:22px; height:9px; border-radius:2px; margin-right:6px; vertical-align:middle}
.legend .pt{width:11px; height:11px; border-radius:50%; background:var(--ink); border:2px solid var(--surface); box-shadow:0 0 0 1.5px var(--ink)}
.charts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 22px}

.chart .val{font-size:.82rem; color:var(--ink-2)}

.small{font-size:.8rem; color:var(--ink-3); margin:10px 0 0}
.risk{display:grid; grid-template-columns:auto 1fr; gap:6px 22px; align-items:center}
.risk .big{font-size:2.6rem; font-weight:700; line-height:1; letter-spacing:-0.02em}
.risk .ci{color:var(--ink-2); font-size:.9rem}
.risk p{margin:0}
.caveat{font-size:.84rem; color:var(--ink-3); margin:12px 0 0; max-width:70ch}
details.score{border-top:1px solid var(--line-2)}
details.score:last-child{border-bottom:1px solid var(--line-2)}
details.score summary{list-style:none; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:11px 2px; cursor:pointer; align-items:baseline}

details.score summary .nm small{display:block; font-weight:400; color:var(--ink-3); font-size:.8rem}
details.score summary .v{font-size:1.25rem; font-weight:650; text-align:right}

details.score[open] summary .nm::after{content:""}
.comp{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; padding:0 2px 12px; font-size:.88rem; color:var(--ink-2)}

table.auc{border-collapse:collapse; width:100%; font-size:.9rem; margin:6px 0 4px}

table.auc tr.hl td{font-weight:650}
.tablewrap{overflow-x:auto}
.prose{max-width:70ch} .prose p{margin:0 0 10px}
footer{margin-top:36px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:.82rem}
footer ol{padding-left:18px; margin:6px 0 12px} footer p{max-width:80ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

.rtabs{display:flex; flex-wrap:wrap; gap:2px; border-bottom:2px solid var(--line); margin:0 0 18px}

.panel{display:grid; gap:18px}
.panel-lede{margin:0; color:var(--ink-2); max-width:70ch}

.card .lede{margin:0 0 10px}
.card > svg{width:100%; height:auto; display:block}
.hero-card{border-color:var(--dead); border-width:1.5px}
.legend svg{vertical-align:middle; margin-right:6px}
table.mini{border-collapse:collapse; width:100%; font-size:.86rem; margin:8px 0 2px}

.fields.kin{grid-template-columns:repeat(3,minmax(0,1fr)); margin:6px 0 10px}
@media (max-width:560px){.fields.kin{grid-template-columns:1fr 1fr}.rtabs button{padding:8px 10px; font-size:.9rem}}
.map{background:transparent; border:0; padding:0}
footer .foot-h{font-size:.95rem; color:var(--ink-2); margin:0 0 6px; font-weight:650}
footer .refs-h{margin:12px 0 0}

<script>
const isNum = (x) => typeof x === "number" && Number.isFinite(x);
const BILI_MG = 17.1, CRE_MG = 88.4;
function vis(d) {

function fio2Frac(f) {

      [0.6, 0.9, 1.6, 2.3],

    inr35: isNum(d.inr) && d.inr > 3.5,
    bili300: isNum(d.bili) && d.bili > 300
